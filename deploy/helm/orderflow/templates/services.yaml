{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderflow-{{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: orderflow }
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 25% } }
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: orderflow }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics }
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $svc.image | default $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: {{ $name }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $.Values.secretName }}, key: DATABASE_URL_{{ upper $name }} } }
            {{- range $k, $v := $.Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range $k, $v := $svc.extraEnv }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- if eq $name "payments" }}
            - name: STRIPE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $.Values.secretName }}, key: STRIPE_SECRET_KEY, optional: true } }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: {{ $.Values.secretName }}, key: STRIPE_WEBHOOK_SECRET, optional: true } }
            {{- end }}
          startupProbe:   { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          livenessProbe:  { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /readyz,  port: http }, periodSeconds: 5,  failureThreshold: 2 }
          resources:
            requests: { cpu: {{ $svc.cpu }}, memory: {{ $svc.memory }} }
            limits:   { memory: {{ $svc.memory }} }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: orderflow-{{ $name }}, labels: { app.kubernetes.io/name: {{ $name }} } }
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: orderflow-{{ $name }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orderflow-{{ $name }} }
  minReplicas: {{ $svc.minReplicas }}
  maxReplicas: {{ $svc.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $.Values.hpa.targetCPUUtilizationPercentage }} } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: orderflow-{{ $name }} }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
{{- end }}
