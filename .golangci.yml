version: "2"
linters:
  default: standard
  enable: [bodyclose, errorlint, gosec, misspell, noctx]
  settings:
    gosec:
      # G404: math/rand is fine for jitter and simulators (not security-sensitive)
      excludes: [G104, G115, G404]
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, noctx]
